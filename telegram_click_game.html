<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon RTX Tic-Tac-Toe</title>
  <style>
    :root {
      --bg-1: #030712;
      --bg-2: #130229;
      --cyan: #29f0ff;
      --pink: #ff3fd6;
      --violet: #7f5bff;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text: #eef8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 10% 10%, #2f0c5e 0%, transparent 35%),
                  radial-gradient(circle at 80% 20%, #073864 0%, transparent 40%),
                  radial-gradient(circle at 70% 80%, #4b093a 0%, transparent 35%),
                  linear-gradient(120deg, var(--bg-1), var(--bg-2));
    }

    .bg-wave,
    .bg-wave::before,
    .bg-wave::after {
      content: "";
      position: fixed;
      inset: -20% -30%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(41, 240, 255, 0.14) 70deg, transparent 140deg, rgba(255, 63, 214, 0.12) 210deg, transparent 300deg);
      filter: blur(30px);
      animation: drift 16s linear infinite;
    }

    .bg-wave::before {
      animation-duration: 22s;
      transform: scale(1.2);
      opacity: 0.8;
    }

    .bg-wave::after {
      animation-duration: 28s;
      transform: scale(0.82);
      opacity: 0.55;
    }

    @keyframes drift {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1.08); }
    }

    .app {
      width: min(92vw, 760px);
      padding: 22px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2),
                  0 0 30px rgba(127, 91, 255, 0.35);
      position: relative;
      z-index: 2;
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.25) 45%, transparent 60%);
      transform: translateX(-120%);
      animation: glare 5s ease-in-out infinite;
    }

    @keyframes glare {
      0%, 80% { transform: translateX(-120%); opacity: 0; }
      88% { opacity: 1; }
      100% { transform: translateX(130%); opacity: 0; }
    }

    .title {
      text-align: center;
      margin-bottom: 16px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0.06em;
      text-shadow: 0 0 8px rgba(41, 240, 255, 0.85), 0 0 24px rgba(255, 63, 214, 0.6);
    }

    .top {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .glass-card {
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 14px;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.12);
    }

    .nick-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      background: rgba(6, 15, 30, 0.75);
      border: 1px solid rgba(146, 243, 255, 0.45);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
      box-shadow: 0 0 16px rgba(41, 240, 255, 0.2);
    }

    input:focus { box-shadow: 0 0 22px rgba(255, 63, 214, 0.45); }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      background: linear-gradient(120deg, rgba(15, 67, 112, 0.95), rgba(69, 22, 126, 0.95));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 16px rgba(41, 240, 255, 0.38);
    }

    .btn:hover { transform: translateY(-1px) scale(1.01); }
    .btn:active { transform: translateY(1px) scale(0.99); }

    .btn.secondary {
      background: linear-gradient(120deg, rgba(109, 26, 130, 0.95), rgba(30, 98, 143, 0.95));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 16px rgba(255, 63, 214, 0.42);
    }

    .score {
      display: grid;
      gap: 7px;
      font-size: 15px;
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      background: rgba(8, 16, 31, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 7px 9px;
    }

    .game {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.18));
      backdrop-filter: blur(4px);
      cursor: pointer;
      font-size: clamp(36px, 8vw, 58px);
      color: #fff;
      text-shadow: 0 0 24px currentColor;
      transition: transform .1s ease, box-shadow .2s ease;
      display: grid;
      place-items: center;
    }

    .cell:hover { transform: translateY(-2px); }
    .cell.x { color: var(--cyan); box-shadow: inset 0 0 30px rgba(41, 240, 255, 0.24), 0 0 15px rgba(41, 240, 255, 0.3); }
    .cell.o { color: var(--pink); box-shadow: inset 0 0 30px rgba(255, 63, 214, 0.22), 0 0 15px rgba(255, 63, 214, 0.3); }

    .status {
      margin-top: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 17px;
      min-height: 26px;
      text-shadow: 0 0 10px rgba(127, 91, 255, 0.8);
    }

    @media (max-width: 640px) {
      .top { grid-template-columns: 1fr; }
      .app { padding: 16px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-wave"></div>

  <main class="app">
    <h1 class="title">Neon RTX Tic-Tac-Toe</h1>

    <section class="top">
      <div class="glass-card nick-wrap">
        <label for="nickname">Ник игрока X</label>
        <input id="nickname" maxlength="20" placeholder="Введи ник..." value="Игрок X" />
        <div class="btn-row">
          <button id="newRoundBtn" class="btn">Новый раунд</button>
          <button id="resetAllBtn" class="btn secondary">Сбросить счёт</button>
        </div>
      </div>

      <div class="glass-card score">
        <div class="score-line"><span>Победы X (<span id="nameX">Игрок X</span>)</span><b id="scoreX">0</b></div>
        <div class="score-line"><span>Победы O (Neon AI)</span><b id="scoreO">0</b></div>
        <div class="score-line"><span>Ничьи</span><b id="drawScore">0</b></div>
      </div>
    </section>

    <section id="board" class="game" aria-label="Игровое поле 3 на 3"></section>
    <div id="status" class="status"></div>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const nicknameInput = document.getElementById('nickname');
    const nameXEl = document.getElementById('nameX');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const drawScoreEl = document.getElementById('drawScore');
    const statusEl = document.getElementById('status');
    const newRoundBtn = document.getElementById('newRoundBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    const LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let finished = false;
    let score = { X: 0, O: 0, draw: 0 };

    function sanitizeName(value) {
      return value.trim().slice(0, 20) || 'Игрок X';
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      board.forEach((value, index) => {
        const button = document.createElement('button');
        button.className = `cell ${value ? value.toLowerCase() : ''}`;
        button.type = 'button';
        button.textContent = value;
        button.setAttribute('aria-label', `Клетка ${index + 1}`);
        button.addEventListener('click', () => onCellClick(index));
        boardEl.appendChild(button);
      });
    }

    function checkWinner(state) {
      for (const [a, b, c] of LINES) {
        if (state[a] && state[a] === state[b] && state[b] === state[c]) {
          return state[a];
        }
      }
      return '';
    }

    function emptyIndices(state) {
      return state.map((cell, idx) => cell === '' ? idx : -1).filter(idx => idx !== -1);
    }

    function aiMove() {
      const free = emptyIndices(board);
      if (!free.length || finished) return;

      for (const idx of free) {
        const test = [...board];
        test[idx] = 'O';
        if (checkWinner(test) === 'O') return idx;
      }

      for (const idx of free) {
        const test = [...board];
        test[idx] = 'X';
        if (checkWinner(test) === 'X') return idx;
      }

      if (free.includes(4)) return 4;
      const corners = free.filter(i => [0, 2, 6, 8].includes(i));
      if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
      return free[Math.floor(Math.random() * free.length)];
    }

    function updateScoreUI() {
      scoreXEl.textContent = score.X;
      scoreOEl.textContent = score.O;
      drawScoreEl.textContent = score.draw;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function endRound(winner) {
      finished = true;
      if (winner === 'X') {
        score.X += 1;
        setStatus(`⚡ ${sanitizeName(nicknameInput.value)} побеждает!`);
      } else if (winner === 'O') {
        score.O += 1;
        setStatus('🤖 Neon AI победил. Попробуй реванш!');
      } else {
        score.draw += 1;
        setStatus('✨ Ничья! Космический баланс.');
      }
      updateScoreUI();
    }

    function onCellClick(index) {
      if (finished || board[index]) return;

      board[index] = 'X';
      renderBoard();

      let winner = checkWinner(board);
      if (winner) return endRound(winner);
      if (!board.includes('')) return endRound('');

      currentPlayer = 'O';
      setStatus('Neon AI думает...');

      setTimeout(() => {
        const move = aiMove();
        if (move !== undefined) {
          board[move] = 'O';
          renderBoard();
        }

        winner = checkWinner(board);
        if (winner) return endRound(winner);
        if (!board.includes('')) return endRound('');

        currentPlayer = 'X';
        setStatus(`Ходит ${sanitizeName(nicknameInput.value)} (X)`);
      }, 280);
    }

    function newRound() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      finished = false;
      renderBoard();
      setStatus(`Ходит ${sanitizeName(nicknameInput.value)} (X)`);
    }

    nicknameInput.addEventListener('input', () => {
      const name = sanitizeName(nicknameInput.value);
      nameXEl.textContent = name;
      if (!finished && currentPlayer === 'X') {
        setStatus(`Ходит ${name} (X)`);
      }
    });

    newRoundBtn.addEventListener('click', newRound);

    resetAllBtn.addEventListener('click', () => {
      score = { X: 0, O: 0, draw: 0 };
      updateScoreUI();
      newRound();
    });

    nameXEl.textContent = sanitizeName(nicknameInput.value);
    updateScoreUI();
    newRound();
  </script>
</body>
</html>
